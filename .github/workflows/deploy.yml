name: Deploy American English Method

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare local Founding Fathers portraits
        run: |
          mkdir -p public/images/founders
          curl -fL --retry 4 --retry-delay 2 -A "AmericanEnglishMethod/1.0" "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Gilbert_Stuart_-_George_Washington_-_WGA21945.jpg/900px-Gilbert_Stuart_-_George_Washington_-_WGA21945.jpg" -o public/images/founders/washington.jpg
          curl -fL --retry 4 --retry-delay 2 -A "AmericanEnglishMethod/1.0" "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Rembrandt_Peale_-_Thomas_Jefferson_-_Google_Art_Project.jpg/900px-Rembrandt_Peale_-_Thomas_Jefferson_-_Google_Art_Project.jpg" -o public/images/founders/jefferson.jpg
          curl -fL --retry 4 --retry-delay 2 -A "AmericanEnglishMethod/1.0" "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Joseph_Siffrein_Duplessis_-_Benjamin_Franklin_-_Google_Art_Project.jpg/900px-Joseph_Siffrein_Duplessis_-_Benjamin_Franklin_-_Google_Art_Project.jpg" -o public/images/founders/franklin.jpg
          curl -fL --retry 4 --retry-delay 2 -A "AmericanEnglishMethod/1.0" "https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/John_Adams_Portrait.jpg/900px-John_Adams_Portrait.jpg" -o public/images/founders/adams.jpg
          curl -fL --retry 4 --retry-delay 2 -A "AmericanEnglishMethod/1.0" "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/James_Madison_by_Gilbert_Stuart.jpg/900px-James_Madison_by_Gilbert_Stuart.jpg" -o public/images/founders/madison.jpg
          curl -fL --retry 4 --retry-delay 2 -A "AmericanEnglishMethod/1.0" "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/John_Trumbull_-_Alexander_Hamilton_-_Google_Art_Project.jpg/900px-John_Trumbull_-_Alexander_Hamilton_-_Google_Art_Project.jpg" -o public/images/founders/hamilton.jpg
      - name: Install dependencies
        run: npm install
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build website
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
